name: 주간 실거래 동향 발표 (매주 월요일 오전 7시)
# 계산(weekly.yml, 월요일 03:43)은 결과를 비공개 엔진 data/weekly 에만 둔다. 이 워크플로가 발표 시각에 공개 저장소(jangdaejang-data)로 올린다.
#  · 발표 시각이 지난 판만 올림(weekly.py publish --now). 모닝 브리핑의 '지난주 우리 지역은?' 칸(engine data/weekly/brief_wk → data/brief/wk/)도 함께.
#  · 7시 실행이 늦거나 실패해도 7시 30분에 한 번 더(이미 올렸으면 바뀐 것 없음으로 끝남). 실패하면 직전 공개본 그대로.
on:
  schedule:
    - cron: '0 22 * * 0'      # 한국 시각 월요일 07:00 (발표 시각 — 일부러 정각)
    - cron: '30 22 * * 0'     # 한국 시각 월요일 07:30 (다시 확인)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weekly-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: 엔진 불러오기 (비공개 저장소 — 보관한 판)
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          for i in 1 2 3; do git clone -q --depth 1 "https://x-access-token:${PUBLISH_TOKEN}@github.com/chrisjangdaejang-ux/jangdaejang-engine.git" engine && break; sleep 15; done
          [ -d engine/data/weekly ] || { echo "엔진 보관본 없음 → 직전 공개본 유지"; exit 1; }
      - name: 발표 (발표 시각이 지난 판만 공개 저장소로)
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: bash .github/scripts/weekly_release.sh engine
