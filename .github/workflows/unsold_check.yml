name: 미분양 표 확인 (수동, 임시)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 엔진 불러오기 (비공개 저장소)
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          git clone -q --depth 1 "https://x-access-token:${PUBLISH_TOKEN}@github.com/chrisjangdaejang-ux/jangdaejang-engine.git" engine
          cp -r engine/scripts ./scripts
          cp engine/data/*.json data/
      - run: pip install -q requests
      - name: 경기 미분양 형식 확인 (키 값은 출력하지 않음, 결과 코드·집계만)
        env:
          GG_DATA_KEY: ${{ secrets.GG_DATA_KEY }}
        run: |
          cd scripts
          python - <<'PY'
          import os, collections
          from common import *
          import bunyang as B
          codes = load_json(CODES_FILE, {})['codes']
          st = {}
          rows, ym = B.fetch_unsold(codes, st)
          print('상태', st, '기준월', repr(ym), '단지', len(rows), '미분양', sum(x['us'] for x in rows), '코드 못 맞춤', sum(1 for x in rows if not x['g']))
          print('구별 미분양 상위', collections.Counter({x['gn']: 0 for x in rows}) and sorted(collections.Counter(x['gn'] for x in rows for _ in range(x['us'])).items(), key=lambda t: -t[1])[:8])
          print('준공 여부별', {k: sum(x['us'] for x in rows if x['done'] == k) for k in {x['done'] for x in rows}})
          print('이름 예', [x['n'] for x in rows[:5]], 'id 중복', len(rows) - len({x['id'] for x in rows}))
          PY
