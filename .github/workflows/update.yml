name: 실거래 수집 및 사이트 갱신

on:
  schedule:
    - cron: '21 */6 * * *'   # 6시간마다(하루 4번). 한 번 실행이 2~3시간 걸려 3시간 간격이면 겹침 — API 한도는 DAILY_CAP로 관리
  workflow_dispatch:            # Actions 탭에서 수동 실행 가능
    inputs:
      max_minutes:
        description: '수집에 쓸 최대 시간(분)'
        default: '120'

env:
  PYTHONUNBUFFERED: '1'          # 진행 기록을 바로바로 출력

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 엔진 불러오기 (비공개 저장소)
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          git clone -q --depth 1 "https://x-access-token:${PUBLISH_TOKEN}@github.com/chrisjangdaejang-ux/jangdaejang-engine.git" engine
          cp -r engine/scripts ./scripts
          cp engine/data/*.json data/
          echo "엔진 불러옴"

      - name: 지난번 공개 사이트 데이터 불러오기 (어떤 생성 단계가 실패해도 그 부분은 직전 자료 유지)
        # site/data 는 이 저장소에 커밋하지 않는다(정기 실행마다 수십 MB씩 이력이 쌓이던 문제). 대신 공개 저장소의 마지막 배포본에서 시작한다.
        continue-on-error: true
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          rm -rf /tmp/prev
          if [ -n "$PUBLISH_TOKEN" ] && git clone -q --depth 1 -b gh-pages "https://x-access-token:${PUBLISH_TOKEN}@github.com/chrisjangdaejang-ux/jangdaejang-data.git" /tmp/prev && [ -d /tmp/prev/data ]; then
            mkdir -p site/data && cp -rn /tmp/prev/data/. site/data/ && echo "직전 공개 데이터 불러옴"
          else
            echo "직전 공개 데이터 없음 → 새로 생성"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 패키지 설치
        run: pip install requests numpy openpyxl

      - name: 시군구 코드 갱신 (30일마다)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/codes.py

      - name: 실거래 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          # 하루 4번 × 2,400 ≈ 9,600회 (개발계정 한도 10,000). 운영계정 승인으로 한도가 늘면
          # 저장소 Settings → Secrets and variables → Actions → Variables 에 TRADE_CALL_BUDGET(1회 호출 수)만 올리면 됨
          CALL_BUDGET: ${{ vars.TRADE_CALL_BUDGET || '5000' }}
          RUNS_PER_DAY: '4'
          MAX_MINUTES: ${{ github.event.inputs.max_minutes || vars.TRADE_MAX_MINUTES || '120' }}
          WORKERS: '4'
        run: python scripts/collect.py

      - name: 전월세 수집 (전세가율용, 별도 API 한도)
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KIND: rent
          CALL_BUDGET: ${{ vars.RENT_CALL_BUDGET || '5000' }}     # 운영계정 승인 후 변수 RENT_CALL_BUDGET 로 올림
          RUNS_PER_DAY: '4'
          MAX_MINUTES: ${{ vars.RENT_MAX_MINUTES || '60' }}
          WORKERS: '4'
        run: python scripts/collect.py

      - name: 연립·다세대 매매 수집 (빌라·재개발용, 별도 API 한도)
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KIND: villa
          CALL_BUDGET: '2400'
          MAX_MINUTES: '60'
          WORKERS: '4'
        run: python scripts/collect.py

      - name: 전월세 추가 종류 수집 (빌라·오피스텔·단독·다가구 전월세 + 오피스텔·상업업무용·토지·단독다가구 매매 — 활용신청 승인되면 자동 시작)
        timeout-minutes: 70
        # 승인 전이면 종류마다 시험 호출 1번만 하고 건너뜀. 공공데이터포털 API별 한도가 따로라 종류마다 같은 예산(최신 달 먼저 → 과거 채우기)
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          CALL_BUDGET: ${{ vars.EXTRA_RENT_CALL_BUDGET || '2400' }}
          RUNS_PER_DAY: '4'
          MAX_MINUTES: ${{ vars.EXTRA_RENT_MAX_MINUTES || '15' }}
          WORKERS: '4'
        run: |
          for k in rh_rent offi_rent offi_trade sh_rent nrg_trade sh_trade; do KIND=$k python scripts/collect.py || echo "$k 수집 건너뜀"; done

      - name: 토지 매매 수집 (2006-01부터 과거 채우기, 별도 API 한도 — 운영계정 하루 9,500회까지)
        # 위 단계가 시간 한도에 걸려도 따로 돌도록 단계를 나눔. 다른 자료와 한도를 나눠 쓰지 않음(API별 한도)
        timeout-minutes: 20
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KIND: land_trade
          CALL_BUDGET: ${{ vars.LAND_CALL_BUDGET || '2400' }}
          # 2026-11-22 운영계정 신청 → 수집기 기본 하루 9,500회. 운영계정이 아직 안 켜졌으면 포털 '한도 초과'(약 1,000회)에서 멈추고 다음 날 이어 받음.
          # 변수 LAND_DAILY_CAP 이 있으면 그 값이 우선(비워 두면 됨)
          DAILY_CAP_LAND_TRADE: ${{ vars.LAND_DAILY_CAP || '' }}
          RUNS_PER_DAY: '4'
          MAX_MINUTES: '15'
          WORKERS: '4'
        run: python scripts/collect.py

      - name: 단지 정보 수집 (세대수·사용승인일, K-apt)
        timeout-minutes: 20
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          CALL_BUDGET: '1200'
        run: python scripts/kapt.py

      - name: 건축물대장 수집 (재건축 사업성 - 용적률·대지면적)
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          CALL_BUDGET: '1500'
        run: python scripts/bld.py

      - name: 통건물 추정 위치 (건축HUB 건축물대장 표제부와 가려진 지번 거래 맞추기 — 지번이 든 파일·기준·검증은 비공개 엔진 저장소 data/private/ 에만, 공개는 약 100m 좌표·용도·연면적·준공)
        continue-on-error: true
        timeout-minutes: 45
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          CALL_BUDGET: '2000'
        run: |
          if [ ! -d engine/data ]; then echo "엔진 저장소 없음 → 통건물 추정 위치 건너뜀(지번 파일을 공개 저장소에 두지 않기 위해)"; exit 0; fi
          python scripts/estbld.py > /tmp/estbld.log 2>&1 && echo "통건물 추정 위치 단계 끝" || echo "통건물 추정 위치 건너뜀 — logs/estbld.log 확인"
          grep -E '^\[estbld\] (받은|통건물)' /tmp/estbld.log || true

      - name: 분양·인구 통계 (청약홈 입주예정, KOSIS 인구·연령별 인구·인구이동·세대원수)
        timeout-minutes: 25
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KOSIS_KEY: ${{ secrets.KOSIS_KEY }}
          ECOS_KEY: ${{ secrets.ECOS_KEY }}             # 한국은행 ECOS 인증키(선택 — 없으면 금리만 건너뜀)
        run: |
          python scripts/applyhome.py > /tmp/applyhome.log 2>&1 && echo "청약홈 분양정보 단계 끝(세부 결과는 비공개 저장소 logs/applyhome.log)" || echo "청약홈 분양정보 실패 — 비공개 저장소 logs/applyhome.log 확인"
          python scripts/kosis.py
          python scripts/kosis_extra.py || true
          python scripts/kosis_demo.py || echo "인구 구조(연령별·인구이동·세대원수) 수집 건너뜀"      # 로그 [kosis-demo]: 쓴 표 ID·수록기간·보유 기간
          python scripts/rebuild_stage.py > /tmp/rebuild_stage.log 2>&1 || true

      - name: 시장 통계 (부동산원 매입자 거주지·연령대·아파트 가격지수, 주택 인허가·착공·준공, 시군구 근로소득)
        timeout-minutes: 30
        continue-on-error: true
        env:
          KOSIS_KEY: ${{ secrets.KOSIS_KEY }}
          REB_KEY: ${{ secrets.REB_KEY }}               # R-ONE 인증키(없으면 부동산원 부분만 건너뜀)
          RONE_IDX_CALLS: '80'                          # 부동산원 가격지수(지도 '지역 분석') 한 번 실행 호출 상한 — 나머지는 다음 실행에서 이어 받음
          SEOUL_KEY: ${{ secrets.SEOUL_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          RONE_MAX_MIN: '20'                            # R-ONE 응답이 느려도 이 시간 안에 받은 데까지 저장하고 끝(단계 제한 30분)
        run: |
          python scripts/kosis_market.py || echo "주택건설실적·근로소득 수집 건너뜀"     # 로그 [kosis-mkt]: 쓴 표 ID·수록기간·시군구 수
          python scripts/rone.py || echo "부동산원 매입자 거주지·연령대 수집 건너뜀"      # 로그 [rone]

      - name: 상권 통계 (서울 상권 매출·점포, 소상공인 상가(상권)정보 — 상가·건물 탭)
        # 예전엔 위 단계 안에서 R-ONE 이 늦으면 30분 제한에 걸려 실행되지 못했음 → 따로 뗌. 상가정보는 시군구 단위로 이어받음
        timeout-minutes: 40
        continue-on-error: true
        env:
          SEOUL_KEY: ${{ secrets.SEOUL_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          SEMAS_MAX_MIN: '25'
        run: python scripts/sangkwon.py || echo "상권 통계 수집 건너뜀"                    # 로그 [sangkwon]

      - name: 부동산원 상업용부동산 임대동향 (지역 임대료·공실률·수익률 — 상가·건물 탭)
        timeout-minutes: 15
        continue-on-error: true
        env:
          REB_KEY: ${{ secrets.REB_KEY }}
          RONE_MAX_MIN: '12'
        run: python scripts/rone.py comm || echo "부동산원 임대동향 수집 건너뜀"            # 로그 [rone-comm]

      - name: 지하철 역 위치(서울시 역사마스터 정보, 공공) + 역별 승하차 (서울 열린데이터)
        # 역 위치 표를 매일 다시 받음 → 새로 개통한 역이 들어오면 다음 '좌표' 단계에서 신설역이 공공 좌표로 자동 전환('개통 예정' 표시 빠짐)
        timeout-minutes: 10
        continue-on-error: true
        env:
          SEOUL_KEY: ${{ secrets.SEOUL_KEY }}
        run: |
          python scripts/station_pub.py fetch || echo "역 위치 표 갱신 건너뜀(이전 표 그대로)"
          python scripts/subway.py || echo "지하철 승하차 건너뜀"

      - name: 좌표 (브이월드 - 단지·역 위치)
        timeout-minutes: 20
        continue-on-error: true
        env:
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          CALL_BUDGET: '4500'
        run: python scripts/geocode.py 2>&1 | grep -v "^\[geocode\] 역 " 

      - name: 정비구역 경계 (서울시 의제처리구역 위치정보 OA-20957, 30일마다) + 빌라 지번 좌표 — 구역 안/밖 판정용
        timeout-minutes: 15
        continue-on-error: true
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
          ZONE_GEO_BUDGET: ${{ vars.ZONE_GEO_BUDGET || '4000' }}
        run: |
          pip install -q pyshp pyproj
          python scripts/zone_bounds.py > /tmp/zone_bounds.log 2>&1 && echo "정비구역 경계 단계 끝(세부는 비공개 저장소 logs/zone_bounds.log)" || echo "정비구역 경계 단계 실패 — logs/zone_bounds.log 확인"

      - name: 수집 원자료 먼저 저장 (뒤 단계가 늦어지거나 실패해도 받은 자료·하루 호출 기록 보존)
        if: always()
        run: |
          git config user.name "jangdaejang-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -qm "수집 원자료 $(date -u +%F)"
          git pull -q --rebase -X theirs origin main || true
          git push -q || true

      - name: 사이트 데이터 생성 (세부 결과는 비공개 저장소 logs/build.log에만 기록)
        env:
          WATCH_DIR: ${{ github.workspace }}/engine/data/watch   # 정책·개발사업 수집 장부 → 공개 policy.json·devproj.json 의 checked(화면 기준일·'자료 갱신 지연')
        run: |
          python scripts/build_site.py > /tmp/build.log 2>&1 && echo "사이트 데이터 생성 완료" || { echo "사이트 데이터 생성 실패 — 비공개 저장소 logs/build.log 확인"; exit 1; }

      - name: 단지 이름 별칭 (실거래 이름·K-apt 공식 이름·도로명 주소·옛 이름 → 시세 목록 price/sNN.json 별칭 칸, 목록 밖 K-apt 단지 → site/data/alias/)
        # 검색창에서 '청담 e편한세상 4차'·'청담대림' 처럼 실거래 이름과 다르게 쳐도 찾게. 실패하면 별칭 없이 그대로(검색은 이름 규칙만으로 동작)
        continue-on-error: true
        run: python scripts/aliases.py build site/data 2>&1 | tee -a /tmp/build.log | grep '^\[alias\]' || echo "단지 이름 별칭 건너뜀"

      - name: 지도 '개발·교통 예정' (공식 발표에 적힌 예정 연도·공식 정거장 순서·공식 구역 경계만 → site/data/devmap.json)
        continue-on-error: true
        run: python scripts/devmap.py build site/data > /tmp/devmap.log 2>&1 && echo "개발·교통 예정 지도 자료 완료" || echo "개발·교통 예정 지도 자료 건너뜀(직전 공개본 유지, logs/devmap.log)"

      - name: 첫 화면 요약 (공개 실거래·점수 파일만 읽어 '더 오를 단지' 순위·하락/신고가 레이스 → site/data/home/)
        continue-on-error: true
        run: python scripts/home_pulse.py site/data || echo "첫 화면 요약 건너뜀(직전 공개본 유지)"

      - name: 첫 화면 '하루 세 번' 카드·관심 목록 변화·오늘의 집값 맞혀 보기 (직전 공개본과 비교해 처음 보인 거래 → site/data/today/)
        # 신고가·큰 하락·특수 거래 의심 표시와 TOP 은 모닝 브리핑과 같은 함수(brief.judge·market_trades). 직전 공개본(/tmp/prev)이 없으면 비교만 건너뜀
        continue-on-error: true
        run: python scripts/today_feed.py site/data /tmp/prev/data || echo "오늘 카드 건너뜀(직전 공개본 유지)"

      - name: 매물 설명서용 주변 중학교·지하철역 위치 (학교알리미·서울 열린데이터 공개 좌표 → site/data/poi/)
        continue-on-error: true
        run: python scripts/content_kit.py poi site/data || echo "주변 위치 건너뜀(직전 공개본 유지)"

      - name: 학군·생활 정보 (비공개 엔진 data/private/life 의 통학구역·병원·학원·공원 정리본 + 공개 단지 좌표 → site/data/life/, 단지별 개수·학교 이름·거리만)
        continue-on-error: true
        run: python scripts/life.py build site/data || echo "학군·생활 정보 건너뜀(직전 공개본 유지)"

      - name: 단지 시설 (비공개 엔진 data/private/facility 의 K-apt 상세 정리본 × 공개 단지 목록 → site/data/fac/, 커뮤니티 시설·주차·CCTV·승강기)
        continue-on-error: true
        run: python scripts/facility.py build site/data 2>&1 | tee -a /tmp/build.log || echo "단지 시설 건너뜀(직전 공개본 유지)"

      - name: 지도 '지역 분석' 구별 요약 (공개 시세 + 청약홈 입주예정·정비사업·부동산원 지표 → site/data/region/)
        continue-on-error: true
        run: python scripts/region_pulse.py site/data || echo "지역 분석 요약 건너뜀(직전 공개본 유지)"

      - name: 광역시 정비사업 추진현황 (대구·인천 공공데이터포털 파일, 7일마다)
        continue-on-error: true
        run: |
          pip install -q xlrd
          python scripts/rebuild_metro.py > /tmp/rebuild_metro.log 2>&1 && echo "광역시 정비사업 단계 끝(세부는 비공개 저장소 logs/rebuild_metro.log)" || echo "광역시 정비사업 단계 실패 — logs/rebuild_metro.log 확인"

      - name: 재개발·빌라 데이터 생성 (세부 결과는 비공개 저장소 logs/villa.log에만 기록)
        continue-on-error: true
        run: python scripts/villa.py > /tmp/villa.log 2>&1 && echo "빌라 데이터 생성 완료" || echo "빌라 데이터 생성 건너뜀"

      - name: 청약 데이터 생성 (청약홈 공고·당첨 가점, 세부 결과는 비공개 저장소 logs/chungyak.log에만 기록)
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/chungyak.py > /tmp/chungyak.log 2>&1 && echo "청약 데이터 생성 완료" || echo "청약 데이터 생성 건너뜀"

      - name: 분양 데이터 생성 (청약홈 아파트·오피스텔·도시형·민간임대·무순위/잔여세대 + 정비사업 분양예정, 세부 결과는 비공개 저장소 logs/bunyang.log에만 기록)
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
          CALL_BUDGET: '300'
          BUNYANG_EXTRA: '1'          # 미분양(경기도, GG_DATA_KEY) 켬. 주택인허가는 BUNYANG_PERMIT_URL 이 없으면 자동으로 꺼짐
          GG_DATA_KEY: ${{ secrets.GG_DATA_KEY }}
          GG_UNSOLD_SERVICE: ${{ vars.GG_UNSOLD_SERVICE || '' }}     # 경기데이터드림 OpenAPI 서비스명(비우면 안내 페이지에서 찾음)
          GG_UNSOLD_FIELDS: ${{ vars.GG_UNSOLD_FIELDS || '' }}       # 필드 이름이 다를 때만 JSON으로 지정
        run: python scripts/bunyang.py > /tmp/bunyang.log 2>&1 && echo "분양 데이터 생성 완료" || echo "분양 데이터 생성 건너뜀"

      - name: 소규모 신축 현장 (건축HUB 건축인허가 — 빌라·도시형·소형 오피스텔·상가, 공개 지도 레이어 site/data/newbuild.json · 주소가 든 영업 목록은 비공개 엔진 저장소 data/private/ 에만)
        # 2026-11-21 승인(ArchPmsHubService). 오류는 logs/newbuild.log·data/newbuild_state.json status 로 구분: serviceNotFound(주소 틀림·승인 직후) / notRegistered / quota
        continue-on-error: true
        timeout-minutes: 40
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          CALL_BUDGET: '800'
          NEWBUILD_SIDO: ${{ vars.NEWBUILD_SIDO || '11,28,41' }}
        run: |
          if [ ! -d engine/data ]; then echo "엔진 저장소 없음 → 신축 현장 건너뜀(주소 파일을 공개 저장소에 두지 않기 위해)"; exit 0; fi
          # 시험 호출 1회: HTTP 상태·resultCode·판정(ok/serviceNotFound=noService/notRegistered/quota)·건수만 Actions 로그에(키·주소 없음)
          python scripts/newbuild.py probe || echo "시험 호출 실패(본 수집은 계속)"
          python scripts/newbuild.py > /tmp/newbuild.log 2>&1 && echo "신축 현장 단계 끝" || echo "신축 현장 단계 건너뜀 — logs/newbuild.log 확인"

      - name: 청약 공고별 분양가·입지 분석 (청약·분양·실거래·점수·성적표 공개 자료 → site/data/chungyak/price.json·price/·plan_near.json(분양 예정 주변 신축 시세), 세부는 비공개 저장소 logs/cy_price.log)
        continue-on-error: true
        run: python scripts/cy_price.py site/data > /tmp/cy_price.log 2>&1 && echo "분양가·입지 분석 완료" || echo "분양가·입지 분석 건너뜀(직전 공개본 유지)"

      - name: 재현 성적표 (매월 기준 월 백테스트 — 자료 끝 달이 바뀐 첫 실행만, 세부는 비공개 저장소 logs/backtest.log)
        timeout-minutes: 90
        continue-on-error: true
        run: python scripts/backtest_monthly.py > /tmp/backtest.log 2>&1 && echo "재현 성적표 단계 끝" || echo "재현 성적표 실패 — logs/backtest.log 확인"

      - name: 예측 스냅숏 (그달 첫 실행만 — 공개 자료 그대로 고정 저장, 이미 있으면 건너뜀·덮어쓰기 없음, 해시는 공개 index.json·track.json)
        # 저장 위치: engine/data/pred_snapshots/YYYY-MM.json + ledger.json → 다음 '엔진 데이터 저장' 단계가 비공개 저장소에 커밋
        timeout-minutes: 10
        continue-on-error: true
        run: python scripts/track.py snap site/data

      - name: 자료 원천 상태 (원천마다 한 줄 — ok / 실패+이유 / 한도 / 신청 필요, 실행 요약 표에도)
        if: always()
        continue-on-error: true
        run: python scripts/source_status.py print || true

      - name: 엔진 데이터 저장 (비공개 저장소)
        if: always()
        run: |
          [ -d engine ] || exit 0
          for f in rail.json supply.json station_xy.json seoul_station_master.json supply_xy.json model.json model5.json model_region.json model_offi.json model_comm.json rebuild_zones.json bunyang_xy.json zone_poly.json villa_xy.json; do [ -f data/$f ] && cp data/$f engine/data/ || true; done
          mkdir -p engine/logs && cp /tmp/*.log engine/logs/ 2>/dev/null || true
          cd engine
          git config user.name "jangdaejang-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -qm "엔진 데이터 $(date -u +%F)"
          git pull -q --rebase -X theirs || true
          git push -q || true
      - name: 수집 데이터 저장
        if: always()
        run: |
          git config user.name "jangdaejang-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data                     # 원자료·수집 기록만(site/data 는 공개 저장소로만 내보냄 — 이력 커지지 않게)
          git diff --cached --quiet || git commit -m "실거래 데이터 갱신 $(date -u +%F)"
          git pull --rebase -X theirs origin main || true
          git push

      - name: 모닝 브리핑 최신본 다시 받기 (이 실행 중에 brief.yml 이 올린 data/brief 를 덮어쓰지 않게)
        continue-on-error: true
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          [ -n "$PUBLISH_TOKEN" ] || exit 0
          rm -rf /tmp/bprev && git clone -q --depth 1 --filter=blob:none --sparse -b gh-pages "https://x-access-token:${PUBLISH_TOKEN}@github.com/chrisjangdaejang-ux/jangdaejang-data.git" /tmp/bprev \
            && (cd /tmp/bprev && git sparse-checkout set --no-cone /data/brief/) && [ -d /tmp/bprev/data/brief ] \
            && rm -rf site/data/brief && cp -r /tmp/bprev/data/brief site/data/brief && echo "모닝 브리핑 최신본 유지" || echo "모닝 브리핑 없음"

      - name: 주간 실거래 동향 최신본 다시 받기 (이 실행 중에 weekly.yml 이 올린 data/weekly 를 덮어쓰지 않게)
        continue-on-error: true
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          [ -n "$PUBLISH_TOKEN" ] || exit 0
          rm -rf /tmp/wprev && git clone -q --depth 1 --filter=blob:none --sparse -b gh-pages "https://x-access-token:${PUBLISH_TOKEN}@github.com/chrisjangdaejang-ux/jangdaejang-data.git" /tmp/wprev \
            && (cd /tmp/wprev && git sparse-checkout set --no-cone /data/weekly/) && [ -d /tmp/wprev/data/weekly ] \
            && rm -rf site/data/weekly && cp -r /tmp/wprev/data/weekly site/data/weekly && echo "주간 실거래 동향 최신본 유지" || echo "주간 실거래 동향 없음"

      - name: 공개 사이트로 내보내기 (결과 파일만, jangdaejang-data 저장소)
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then echo "PUBLISH_TOKEN 없음 → 건너뜀"; exit 0; fi
          # 노하우 유출 검사: 가중치·계수·영향도·기준값·기여도가 하나라도 있으면 내보내지 않음(이 단계 실패 → 아래 Pages 배포도 건너뜀)
          python scripts/public_guard.py site/data --models data || { echo "공개 자료 검사 실패 → 내보내기 중단(직전 공개본 유지)"; exit 1; }
          rm -rf /tmp/pub && cp -r site /tmp/pub && touch /tmp/pub/.nojekyll
          cd /tmp/pub && git init -q -b gh-pages && git add -A
          git -c user.name=jangdaejang-bot -c user.email=actions@users.noreply.github.com commit -qm "사이트 데이터 $(date -u +%F)"
          git push -f -q "https://x-access-token:${PUBLISH_TOKEN}@github.com/chrisjangdaejang-ux/jangdaejang-data.git" gh-pages
          echo "공개 저장소로 내보냄"

      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: site
      - id: deploy
        continue-on-error: true            # 비공개 전환 후에는 이 저장소 Pages가 꺼지므로 실패해도 무시
        uses: actions/deploy-pages@v4
