name: 내 집 성적표 자료 (매주 월요일 오전 7시 52분)
# 주간 실거래 동향 발표(weekly_release.yml, 월요일 07:00) 뒤에 전국 단지의 '내 집 성적표' 공개 자료를 만든다(엔진 scripts/home_report.py).
#  · 공개 자료만 다시 묶음: 시세·동네 순위(웹 내 집 시세 화면과 같은 규칙)·미래가치 점수·전세가율·이번 주 가격 흐름(주간 동향 숫자 그대로)·우리 동네 새 거래.
#  · 누가 어떤 집을 등록했는지는 이 단계와 상관없음 — 전국 모든 단지를 똑같이 만든다(개인정보 없음). 결과: jangdaejang-data gh-pages data/report/
#  · 메일은 Apps Script(reportWeekly, 월요일 오전 9시대·11시대)가 이 결과를 읽어 동의한 분께만 보냄.
#  · 빠지거나 늦으면 예비 08:12·08:37·09:22 + 감시(watchdog.yml, 'report')가 다시 함. 실패하면 직전 공개본 그대로.
on:
  schedule:
    - cron: '52 22 * * 0'     # 한국 시각 월요일 07:52 (07:00 주간 발표 뒤)
    - cron: '12 23 * * 0'     # 월 08:12
    - cron: '37 23 * * 0'     # 월 08:37
    - cron: '22 0 * * 1'      # 월 09:22
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: report
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/sched.py guard report
  report:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 엔진 불러오기 (비공개 저장소 — 계산 스크립트)
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          for i in 1 2 3; do git clone -q --depth 1 --filter=blob:none --sparse "https://x-access-token:${PUBLISH_TOKEN}@github.com/chrisjangdaejang-ux/jangdaejang-engine.git" engine && break; sleep 15; done
          (cd engine && git sparse-checkout set --no-cone /scripts/ '/data/model*.json')
      - name: 성적표 자료 만들기 · 공개 자료 검사 · 내보내기
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: bash .github/scripts/report_build.sh engine
