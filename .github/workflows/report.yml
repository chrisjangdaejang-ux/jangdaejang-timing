name: 내 집 성적표 자료 (매주 월요일 새벽 5시 40분 — 7시 모닝 브리핑 전에)
# 주간 실거래 동향 계산(weekly.yml, 월요일 03:43~05:13) 뒤에 전국 단지의 '내 집 성적표' 자료를 미리 만든다(엔진 scripts/home_report.py).
#  · 공개 자료만 다시 묶음: 시세·동네 순위·미래가치 점수·전세가율·이번 주 가격 흐름(주간 동향 숫자 그대로)·우리 동네 새 거래·지난번 예측 → 실제.
#  · 주간 동향 숫자의 공개 시각(월요일 07:00) 규칙은 그대로: 7시 전에 만든 판은 비공개 엔진 data/report_next/ 에만 두고,
#    weekly_release.sh(07:00)가 주간 동향과 같은 커밋으로 공개한다. 7시가 지난 뒤 돌면(예비 07:52·09:22) 바로 공개한다.
#  · 메일은 Apps Script 가 7시대부터: 모닝 브리핑 구독자는 브리핑 안에, 그 밖의 분은 reportWeekly(7시대, 예비 8시대) — 하루 한 통.
#  · 누가 어떤 집을 등록했는지는 이 단계와 상관없음(개인정보 없음). 실패하면 직전 공개본 그대로.
on:
  schedule:
    - cron: '40 20 * * 0'     # 한국 시각 월요일 05:40 (주간 계산 뒤, 7시 브리핑 전)
    - cron: '5 21 * * 0'      # 월 06:05
    - cron: '30 21 * * 0'     # 월 06:30
    - cron: '52 22 * * 0'     # 월 07:52 (예비 — 7시 전에 못 만들었으면 바로 공개)
    - cron: '22 0 * * 1'      # 월 09:22
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: report
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/sched.py guard report
  report:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 엔진 불러오기 (비공개 저장소 — 계산 스크립트)
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          for i in 1 2 3; do git clone -q --depth 1 --filter=blob:none --sparse "https://x-access-token:${PUBLISH_TOKEN}@github.com/chrisjangdaejang-ux/jangdaejang-engine.git" engine && break; sleep 15; done
          (cd engine && git sparse-checkout set --no-cone /scripts/ '/data/model*.json' /data/weekly/ /data/report_next/)
      - name: 성적표 자료 만들기 · 공개 자료 검사 · 내보내기
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: bash .github/scripts/report_build.sh engine
